name: Release

# Every push to master produces a new version: one immutable semver release
# (vX.Y.Z) carrying the single-binary archives, plus container images pushed to
# GHCR and (when configured) Docker Hub. The Linux image (`splash`) covers five
# architectures; the Windows image (`splash-windows`) is built on a Windows
# runner and covers windows/amd64. Both carry exactly two tags: the exact
# version (1.2.3) and a moving `latest`. GitHub Releases deliberately do NOT get
# a moving `latest` tag (the newest semver release is GitHub's "Latest" by
# default). Pushing a v* tag publishes exactly that version instead of bumping.
#
# When everything succeeds and VPS_SSH_* secrets are configured, a final job
# SSHes into the VPS and runs `bash /ga/script/deploy-splash.sh`; without the
# secrets the deploy step is skipped.
#
# Versioning is semver, the industry default: patch bumps on every push,
# [minor] / [major] in the head commit message bump those components, and
# workflow_dispatch can pin an exact version. First ever release is v0.1.0.
#
# The verify gate runs the same six checks as ci.yml, so a push that breaks
# tests never publishes anything.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix; leave empty to auto-increment'
        required: false
        type: string

permissions:
  contents: read

# Queue, never cancel: every push must get its own version, and queued runs
# see the tags created by the run before them.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.4'
  NODE_VERSION: '26'

jobs:
  verify:
    name: Verify (unit tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::run 'gofmt -w .' on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Go unit tests (race detector)
        run: go test -race ./...

      - name: Frontend type-check
        run: pnpm -C web run typecheck

      - name: Frontend lint
        run: pnpm -C web run lint

      - name: Frontend unit tests
        run: pnpm -C web test

  version:
    name: Compute the next version
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve semver
        id: v
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            git fetch --tags --force --quiet
            latest="$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -V | tail -n1)"
            if [ -z "$latest" ]; then
              version="0.1.0"
            else
              IFS='.' read -r ma mi pa <<< "$latest"
              msg="$(git log -1 --pretty=%B)"
              case "$msg" in
                *'[major]'*) ma=$((ma + 1)); mi=0; pa=0 ;;
                *'[minor]'*) mi=$((mi + 1)); pa=0 ;;
                *)           pa=$((pa + 1)) ;;
              esac
              version="$ma.$mi.$pa"
            fi
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a semver version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing v$version"

  release:
    name: Build binaries + publish the GitHub Release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # One static binary per OS/arch: frontend embedded, pure-Go SQLite,
      # CGO off. Nothing for the user to install besides the file itself.
      - name: Cross-compile every platform + archives + checksums
        env:
          SPLASH_VERSION: v${{ needs.version.outputs.version }}
        run: node scripts/build.mjs release

      - name: Verify checksums
        run: |
          cd dist
          sha256sum --check --strict SHA256SUMS

      - name: Tag and publish the semver release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            git tag -a "$VERSION" -m "splash $VERSION"
            git push origin "$VERSION"
          fi

          notes=$(cat <<EOF
          splash $VERSION — commit ${GITHUB_SHA:0:7}

          Each archive contains ONE self-contained executable: the web UI is
          embedded and SQLite is pure Go, so there is no runtime or dependency
          to install. Unpack and run:

              ./splash            # Linux / macOS
              splash.exe          # Windows

          Default account admin / splash123; pass -seed on first run to load
          demo data. For production set SPLASH_ADMIN_PASSWORD and
          SPLASH_AUTH_SECRET. The user-facing UI is Chinese; everything else
          (docs, API, logs) is English.

          Linux container image (amd64, arm64, arm/v7, ppc64le, s390x):
          ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION

          Windows container image (windows/amd64, Windows Server 2022+):
          ghcr.io/${GITHUB_REPOSITORY,,}-windows:$VERSION
          EOF
          )

          # One immutable release per version. GitHub automatically badges the
          # newest non-prerelease release as "Latest"; there is deliberately NO
          # separate moving `latest` release/tag (the Docker image keeps its
          # own `latest` tag, which is a different thing).
          gh release create "$VERSION" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "splash $VERSION" --notes "$notes"

  docker:
    name: Linux container images (GHCR + Docker Hub, 5 architectures)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN with packages:write is the zero-config path. If the
      # repository's Actions workflow permissions are read-only, or the
      # package's Actions access list does not grant this repo write, GHCR
      # answers "denied: permission_denied: write_package"; a personal access
      # token with write:packages in the GHCR_TOKEN secret bypasses both.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Exactly two tags per registry: the immutable exact version (1.2.3)
      # and the moving `latest`. No major/minor aliases, no commit-sha tags.
      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          ghcr_tags="$ghcr:$VERSION,$ghcr:latest"
          hub_tags=""
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            hub_tags="docker.io/$DOCKERHUB_USERNAME/splash:$VERSION,docker.io/$DOCKERHUB_USERNAME/splash:latest"
          fi
          echo "ghcr=$ghcr_tags" >> "$GITHUB_OUTPUT"
          echo "hub=$hub_tags" >> "$GITHUB_OUTPUT"

      # One manifest list per registry covering the Linux architectures that
      # both Go and the distroless runtime support. Windows/macOS containers
      # are a different OS family; those users get native binaries instead.
      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ steps.tags.outputs.ghcr }}
          build-args: |
            VERSION=v${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Guidance if a registry push was denied
        if: failure()
        run: |
          echo "::notice::If a push was denied (permission_denied: write_package), see docs/RELEASING.md section 'Troubleshooting: GHCR push denied': repository workflow permissions, package Manage Actions access, or set the GHCR_TOKEN secret. Then use Re-run failed jobs."

      - name: Build and push to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ steps.tags.outputs.hub }}
          build-args: |
            VERSION=v${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notice when Docker Hub is not configured
        if: env.DOCKERHUB_USERNAME == ''
        run: |
          echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — images published to GHCR only."

  # Windows containers need a Windows daemon and a Windows base image, so this
  # is a separate job on a Windows runner. Plain `docker build` is deliberate:
  # buildx is not reliable on GitHub-hosted Windows runners, and a single
  # windows/amd64 image needs no cross-building. The result is a separate image
  # repository with the same two tags as the Linux image.
  windows-docker:
    name: Windows container image (GHCR + Docker Hub)
    needs: version
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The host binary on this runner is windows/amd64, with the frontend
      # embedded exactly as in the release archives.
      - name: Build the Windows binary
        env:
          SPLASH_VERSION: v${{ needs.version.outputs.version }}
        run: node scripts/build.mjs

      - name: Assemble the Windows image context
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-image | Out-Null
          Copy-Item Dockerfile.windows windows-image/Dockerfile -Force
          Copy-Item bin/splash.exe windows-image/splash.exe -Force

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push the Windows image
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $ghcr = "ghcr.io/$($($env:GITHUB_REPOSITORY).ToLower())-windows"

          docker build -f windows-image/Dockerfile `
            --build-arg "VERSION=v$version" `
            -t splash-windows:ci windows-image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tags = @("${ghcr}:$version", "${ghcr}:latest")
          if ($env:DOCKERHUB_USERNAME) {
            $hub = "docker.io/$($env:DOCKERHUB_USERNAME)/splash-windows"
            $tags += @("${hub}:$version", "${hub}:latest")
          }
          foreach ($tag in $tags) {
            docker tag splash-windows:ci $tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            docker push $tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not $env:DOCKERHUB_USERNAME) {
            Write-Host 'Docker Hub not configured; Windows image published to GHCR only.'
          }

      - name: Guidance if a registry push was denied
        if: failure()
        run: |
          echo "::notice::If a push was denied, see docs/RELEASING.md section 'Troubleshooting: GHCR push denied'. Then use Re-run failed jobs."

  # Runs only after the release, the Linux image and the Windows image succeed.
  # SSHes into the VPS and runs the operator's deploy script. Skipped entirely
  # when the VPS_SSH_* secrets are absent, so forks / unconfigured repos still
  # publish releases.
  deploy:
    name: Deploy to VPS (SSH)
    needs: [release, docker, windows-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # secrets is not a valid context in step `if`, so surface it through job
    # env (which IS readable from `if`) and gate on env instead. SSHPASS is
    # what sshpass -e reads, so the password never touches argv.
    env:
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
    steps:
      - name: Notice when VPS deploy is not configured
        if: env.VPS_SSH_HOST == '' || env.SSHPASS == ''
        run: |
          echo "::notice::VPS_SSH_HOST / VPS_SSH_PASSWORD not set — skipping VPS deploy."

      - name: Run deploy script on the VPS over SSH
        if: env.VPS_SSH_HOST != '' && env.SSHPASS != ''
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          # sshpass -e reads the password from SSHPASS (not argv). accept-new
          # pins the host key on first contact (TOFU) instead of disabling checks.
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -p "${VPS_SSH_PORT:-22}" \
            "$VPS_SSH_USER@$VPS_SSH_HOST" \
            'bash /ga/script/deploy-splash.sh'
